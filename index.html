<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151c2c;
      --primary: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success-bg: #064e3b;
      --success-text: #34d399;
      --error-bg: #7f1d1d;
      --error-text: #f87171;
      --info-bg: #1e3a8a;
      --info-text: #60a5fa;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; margin: 0 0 4px 0; font-weight: 700; letter-spacing: -0.02em; }
    .header p { color: var(--text-muted); font-size: 0.875rem; margin: 0; }

    .scanner-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    #reader {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: none !important;
    }

    #reader video {
      border-radius: 14px;
      object-fit: cover;
      width: 100% !important;
    }

    #status-container {
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
    }

    .status-box {
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      transition: all 0.2s ease;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-box.error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .bottom-controls {
      margin-top: auto;
      padding-top: 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn-export {
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-export:active { transform: scale(0.98); }

    .file-upload-fallback { text-align: center; }
    .file-upload-fallback label {
      color: #475569;
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
    }
    .file-upload-fallback input { display: none; }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      transform: scale(0.9);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card { transform: scale(1); }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(56, 189, 248, 0.2);
      border-left-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .icon-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }

    .icon-circle.success {
      background: var(--success-bg);
      border: 2px solid var(--success-text);
    }

    .icon-circle.error {
      background: var(--error-bg);
      border: 2px solid var(--error-text);
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 8px 0;
    }

    .modal-msg {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
      margin: 0 0 20px 0;
      word-break: break-word;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary { background: var(--primary); color: #0f172a; }
    .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

    .btn-cancel {
      background: transparent;
      color: var(--text-muted);
      font-size: 0.825rem;
      padding: 6px 12px;
      text-decoration: underline;
      border: none;
      cursor: pointer;
    }

    #error-banner-container {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .alert-banner {
      pointer-events: auto;
      padding: 12px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      font-size: 0.875rem;
      font-weight: 500;
      animation: slideUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .alert-banner.error {
      background: var(--error-bg);
      color: #fca5a5;
      border: 1px solid rgba(248, 113, 113, 0.4);
    }

    .alert-banner.success {
      background: var(--success-bg);
      color: #6ee7b7;
      border: 1px solid rgba(52, 211, 153, 0.4);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .alert-banner .close-btn {
      background: none;
      border: none;
      color: inherit;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      padding: 0 0 0 12px;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>AYAC 2026 Attendance</h1>
    <p>Point camera at student QR code</p>
  </div>

  <div class="scanner-card">
    <div id="reader"></div>
  </div>

  <div id="status-container">
    <div id="status" class="status-box">Requesting Camera...</div>
  </div>

  <div class="bottom-controls">
    <button class="btn-export" onclick="exportScannedCSV()">Export Scanned IDs (CSV)</button>
    <div class="file-upload-fallback">
      <label for="hidden-file-input">Scan from image file instead</label>
      <input type="file" id="hidden-file-input" accept="image/*">
    </div>
  </div>

  <div id="statusModal" class="modal-overlay">
    <div class="modal-card">
      <div id="modalIcon"></div>
      <h3 id="modalTitle" class="modal-title">Checking ID</h3>
      <p id="modalMsg" class="modal-msg">Verifying with database...</p>
      
      <div id="modalActions" class="btn-group" style="display: none;">
        <button id="btnDone" class="btn btn-primary" onclick="closeModalAndResume()">Done</button>
        <button id="btnCancel" class="btn btn-cancel" onclick="cancelAttendance()">Don't mark attendance</button>
      </div>
    </div>
  </div>

  <div id="error-banner-container"></div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRQYi29sudHW3Ijq327xzFD7YnUHplUlDXTlnsz4rJ2ovObQURDFXlRtKValOLG2c3/exec";

    const statusDiv = document.getElementById("status");
    const statusModal = document.getElementById("statusModal");
    const modalIcon = document.getElementById("modalIcon");
    const modalTitle = document.getElementById("modalTitle");
    const modalMsg = document.getElementById("modalMsg");
    const modalActions = document.getElementById("modalActions");
    const btnCancel = document.getElementById("btnCancel");

    let html5QrCode;
    let isProcessing = false;
    let currentRegId = "";

    const scannedRecords = [];
    const fifoQueue = [];
    let isProcessingQueue = false;

    function showLoadingModal() {
      modalIcon.innerHTML = `<div class="spinner"></div>`;
      modalTitle.innerText = "Checking ID";
      modalMsg.innerText = "Verifying database...";
      modalActions.style.display = "none";
      statusModal.classList.add("active");
    }

    function showResultModal(message, isSuccess) {
      if (isSuccess) {
        modalIcon.innerHTML = `
          <div class="icon-circle success">
            <svg viewBox="0 0 24 24" fill="#34d399" width="32" height="32"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
          </div>`;
        modalTitle.innerText = "Success";
        btnCancel.style.display = "block";
      } else {
        modalIcon.innerHTML = `
          <div class="icon-circle error">
            <svg viewBox="0 0 24 24" fill="#f87171" width="32" height="32"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
          </div>`;
        modalTitle.innerText = "Notice";
        btnCancel.style.display = "none";
      }

      modalMsg.innerText = message;
      modalActions.style.display = "flex";
    }

    function closeModalAndResume() {
      statusModal.classList.remove("active");
      if (html5QrCode) {
        try { html5QrCode.resume(); } catch (e) {}
      }
      statusDiv.innerText = "Ready for next scan...";
      statusDiv.className = "status-box";
      isProcessing = false;
      currentRegId = "";
    }

    async function cancelAttendance() {
      if (!currentRegId) {
        closeModalAndResume();
        return;
      }

      const recordIdx = scannedRecords.findIndex(r => r.id === currentRegId);
      if (recordIdx !== -1) scannedRecords.splice(recordIdx, 1);

      const queueIdx = fifoQueue.findIndex(item => item.id === currentRegId);
      if (queueIdx !== -1) fifoQueue.splice(queueIdx, 1);

      showResultModal("Removing attendance entry...", false);

      try {
        await sendCheckInRequest(currentRegId, "undo");
      } catch (err) {}

      setTimeout(() => {
        closeModalAndResume();
      }, 1000);
    }

    function sendCheckInRequest(regId, action = "check") {
      return new Promise((resolve, reject) => {
        const callbackName = "jsonp_cb_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
        const script = document.createElement("script");

        const timeoutId = setTimeout(() => {
          cleanup();
          reject("REQUEST_TIMEOUT");
        }, 8000);

        function cleanup() {
          clearTimeout(timeoutId);
          if (window[callbackName]) delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject("Network connection failed");
        };

        script.src = `${APPS_SCRIPT_URL}?id=${encodeURIComponent(regId)}&action=${action}&callback=${callbackName}&_=${Date.now()}`;
        document.body.appendChild(script);
      });
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      if (html5QrCode) {
        try { html5QrCode.pause(); } catch (e) {}
      }

      showLoadingModal();

      let regId = decodedText.trim();
      if (regId.includes("id=")) {
        regId = regId.split("id=")[1].split("&")[0];
      }

      currentRegId = regId;

      try {
        const response = await sendCheckInRequest(regId, "check");
        handleCheckInResponse(response, regId);
      } catch (err) {
        if (err === "REQUEST_TIMEOUT") {
          closeModalAndResume();
          showNotificationBanner(`Lookup timed out for ${regId}. Retrying in background...`, "error");
          
          sendCheckInRequest(regId, "check")
            .then(res => {
              if (checkIsSuccessful(res)) {
                showNotificationBanner(`Success: ID ${regId} verified after timeout!`, "success");
              }
            })
            .catch(() => {});
        } else {
          showResultModal(`Verification error: ${err}`, false);
        }
      }
    }

    function checkIsSuccessful(response) {
      if (!response) return false;
      if (response.success === true || response.marked === true) return true;
      if (typeof response.status === "string") {
        const st = response.status.toLowerCase();
        if (st === "success" || st === "already_marked" || st === "marked" || st === "ok") return true;
      }
      return false;
    }

    function handleCheckInResponse(response, regId) {
      const isSuccess = checkIsSuccessful(response);

      if (isSuccess) {
        const timestamp = new Date().toISOString();
        const personName = response.name || response.studentName || "Student";
        const verifiedId = response.id || regId;

        scannedRecords.push({ id: verifiedId, name: personName, timestamp: timestamp });
        fifoQueue.push({ id: verifiedId, name: personName, retries: 0 });
        processQueue();

        showResultModal("Success", true);
      } else {
        const msg = (response && response.message) ? response.message : `ID ${regId} not found.`;
        showResultModal(msg, false);
      }
    }

    async function processQueue() {
      if (isProcessingQueue || fifoQueue.length === 0) return;
      isProcessingQueue = true;

      const item = fifoQueue[0];

      try {
        const response = await sendCheckInRequest(item.id, "process");
        if (checkIsSuccessful(response)) {
          fifoQueue.shift();
        } else {
          throw new Error();
        }
      } catch (err) {
        item.retries++;
        if (item.retries >= 2) {
          fifoQueue.shift();
        }
      } finally {
        isProcessingQueue = false;
        if (fifoQueue.length > 0) {
          processQueue();
        }
      }
    }

    function showNotificationBanner(message, type = "error") {
      const container = document.getElementById("error-banner-container");
      const banner = document.createElement("div");
      banner.className = `alert-banner ${type}`;
      banner.innerHTML = `
        <span>${type === 'success' ? '✅' : '⚠️'} ${message}</span>
        <button class="close-btn" onclick="this.parentElement.remove()">✕</button>
      `;
      container.appendChild(banner);

      setTimeout(() => {
        if (banner.parentNode) banner.parentNode.removeChild(banner);
      }, 6000);
    }

    function exportScannedCSV() {
      if (!scannedRecords || scannedRecords.length === 0) {
        alert("No scanned records available to export yet.");
        return;
      }

      let csvRows = ["ID,Name,Scan Timestamp"];
      scannedRecords.forEach(row => {
        const safeName = (row.name || "Student").replace(/"/g, '""');
        csvRows.push(`"${row.id}","${safeName}","${row.timestamp}"`);
      });

      const blob = new Blob([csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `attendance_scans_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    async function startCamera() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 15, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 };

      try {
        await html5QrCode.start({ facingMode: { exact: "environment" } }, config, onScanSuccess);
        statusDiv.innerText = "Ready to scan...";
      } catch (e1) {
        try {
          await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
          statusDiv.innerText = "Ready to scan...";
        } catch (e2) {
          statusDiv.innerText = "Camera permission denied";
          statusDiv.className = "status-box error";
        }
      }
    }

    startCamera();

    document.getElementById("hidden-file-input").addEventListener("change", (e) => {
      if (e.target.files.length === 0) return;
      html5QrCode.scanFile(e.target.files[0], true)
        .then(onScanSuccess)
        .catch(() => {
          statusDiv.innerText = "Failed to parse QR file";
          statusDiv.className = "status-box error";
        });
    });
  </script>
</body>
</html>
