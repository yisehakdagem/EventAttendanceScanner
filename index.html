<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151c2c;
      --primary: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success-bg: #064e3b;
      --success-text: #34d399;
      --error-bg: #7f1d1d;
      --error-text: #f87171;
      --info-bg: #1e3a8a;
      --info-text: #60a5fa;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; margin: 0 0 4px 0; font-weight: 700; letter-spacing: -0.02em; }
    .header p { color: var(--text-muted); font-size: 0.875rem; margin: 0; }

    .scanner-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    #reader {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: none !important;
    }

    #reader video {
      border-radius: 14px;
      object-fit: cover;
      width: 100% !important;
    }

    #status-container {
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
    }

    .status-box {
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      transition: all 0.2s ease;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-box.error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .bottom-controls {
      margin-top: auto;
      padding-top: 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .button-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-export, .btn-secondary {
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
      text-align: center;
    }

    .btn-export:active, .btn-secondary:active { transform: scale(0.98); }

    .file-upload-fallback { text-align: center; }
    .file-upload-fallback label {
      color: #475569;
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
    }
    .file-upload-fallback input { display: none; }

    /* Modal Overlay and Dialog Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 16px;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }

    .modal-body {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.4;
      word-break: break-word;
    }

    .modal-body strong {
      color: var(--text);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn-modal {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }

    .btn-modal:active { transform: scale(0.98); }

    .btn-modal-primary {
      background: var(--primary);
      color: #000;
    }

    .btn-modal-cancel {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .marked-list {
      max-height: 240px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .marked-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
    }

    .marked-item-id {
      font-weight: 600;
      color: var(--text);
    }

    .marked-item-time {
      color: var(--text-muted);
      font-size: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>AYAC 2026 Attendance</h1>
    <p>Point camera at student QR code</p>
  </div>

  <div class="scanner-card">
    <div id="reader"></div>
  </div>

  <div id="status-container">
    <div id="status" class="status-box">Requesting Camera...</div>
  </div>

  <div class="bottom-controls">
    <div class="button-group">
      <button class="btn-export" onclick="showExportChoiceModal()">Export Scanned IDs</button>
      <button class="btn-secondary" onclick="showMarkedIDsModal()">Marked IDs</button>
    </div>
    <div class="file-upload-fallback">
      <label for="hidden-file-input">Scan from image file instead</label>
      <input type="file" id="hidden-file-input" accept="image/*">
    </div>
  </div>

  <div id="modal-container"></div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRQYi29sudHW3Ijq327xzFD7YnUHplUlDXTlnsz4rJ2ovObQURDFXlRtKValOLG2c3/exec";
  const STORAGE_KEY = "ayac_scanned_records";

  const statusDiv = document.getElementById("status");
  let html5QrCode;
  let isProcessingScan = false;

  // ── Local Persistence Helper Functions ─────────────────────

  function loadLocalRecords() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      return [];
    }
  }

  function saveLocalRecord(id, timestamp) {
    const records = loadLocalRecords();
    records.push({ id: id, timestamp: timestamp });
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    } catch (e) {}
  }

  function isAlreadyScannedLocally(id) {
    const records = loadLocalRecords();
    return records.some(r => String(r.id).trim().toLowerCase() === String(id).trim().toLowerCase());
  }

  // ── Fire-and-Forget Network Request ────────────────────────

  function sendCheckInAsync(regId, action = "process") {
    const targetUrl = `${APPS_SCRIPT_URL}?id=${encodeURIComponent(regId)}&action=${action}&_=${Date.now()}`;
    
    if (navigator.sendBeacon) {
      navigator.sendBeacon(targetUrl);
    } else {
      fetch(targetUrl, { mode: 'no-cors' }).catch(() => {});
    }
  }

  // ── QR Scanner Logic ───────────────────────────────────────

  function onScanSuccess(decodedText) {
    if (isProcessingScan) return;

    let regId = decodedText.trim();
    if (regId.includes("id=")) {
      regId = regId.split("id=")[1].split("&")[0];
    }
    regId = regId.replace(/^["']|["']$/g, '').trim();

    if (!regId) return;

    isProcessingScan = true;

    if (isAlreadyScannedLocally(regId)) {
      showNoticeModal("Already Scanned", `ID ${regId} has already been scanned locally.`);
      return;
    }

    showScanConfirmationModal(regId);
  }

  // ── Modal UI System ────────────────────────────────────────

  function closeModal() {
    const container = document.getElementById("modal-container");
    container.innerHTML = "";
    isProcessingScan = false;
  }

  function showScanConfirmationModal(regId) {
    const container = document.getElementById("modal-container");
    container.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-card">
          <h3 class="modal-title">Confirm Attendance</h3>
          <div class="modal-body">
            Scanned ID: <strong>${regId}</strong><br>
            Do you want to mark attendance for this ID?
          </div>
          <div class="modal-actions">
            <button class="btn-modal btn-modal-primary" onclick="confirmMarkAttendance('${regId}')">Mark Attendance</button>
            <button class="btn-modal btn-modal-cancel" onclick="closeModal()">Cancel</button>
          </div>
        </div>
      </div>
    `;
  }

  function confirmMarkAttendance(regId) {
    const timestamp = new Date().toISOString();

    // 1. Store locally immediately
    saveLocalRecord(regId, timestamp);

    // 2. Dispatch request asynchronously without waiting
    sendCheckInAsync(regId, "process");

    // 3. Update UI and resume scanner
    statusDiv.innerText = `Last scanned: ${regId}`;
    statusDiv.className = "status-box";
    closeModal();
  }

  function showNoticeModal(title, message) {
    const container = document.getElementById("modal-container");
    container.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-card">
          <h3 class="modal-title">${title}</h3>
          <div class="modal-body">${message}</div>
          <div class="modal-actions">
            <button class="btn-modal btn-modal-cancel" onclick="closeModal()">Close</button>
          </div>
        </div>
      </div>
    `;
  }

  function showMarkedIDsModal() {
    const records = loadLocalRecords();
    const container = document.getElementById("modal-container");

    let listHtml = "";
    if (records.length === 0) {
      listHtml = `<div class="modal-body">No IDs marked yet.</div>`;
    } else {
      listHtml = `<div class="marked-list">` + records.map(r => {
        const timeStr = new Date(r.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        return `
          <div class="marked-item">
            <span class="marked-item-id">${r.id}</span>
            <span class="marked-item-time">${timeStr}</span>
          </div>
        `;
      }).reverse().join('') + `</div>`;
    }

    container.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-card">
          <h3 class="modal-title">Marked IDs (${records.length})</h3>
          ${listHtml}
          <div class="modal-actions">
            <button class="btn-modal btn-modal-cancel" onclick="closeModal()">Close</button>
          </div>
        </div>
      </div>
    `;
  }

  function showExportChoiceModal() {
    const records = loadLocalRecords();
    if (!records || records.length === 0) {
      showNoticeModal("Export Error", "No scanned records available to export yet.");
      return;
    }

    const container = document.getElementById("modal-container");
    container.innerHTML = `
      <div class="modal-overlay">
        <div class="modal-card">
          <h3 class="modal-title">Export Format</h3>
          <div class="modal-body">Choose a format to download the scanned records:</div>
          <div class="modal-actions">
            <button class="btn-modal btn-modal-primary" onclick="performExport('csv')">CSV</button>
            <button class="btn-modal btn-modal-primary" onclick="performExport('txt')">TXT</button>
          </div>
          <div class="modal-actions">
            <button class="btn-modal btn-modal-cancel" onclick="closeModal()">Cancel</button>
          </div>
        </div>
      </div>
    `;
  }

  function performExport(format) {
    const records = loadLocalRecords();
    if (!records || records.length === 0) return;

    let content = "";
    let mimeType = "";
    let filename = `attendance_scans_${new Date().toISOString().slice(0,10)}`;

    if (format === 'csv') {
      let csvRows = ["ID,Scan Timestamp"];
      records.forEach(row => {
        csvRows.push(`"${row.id}","${row.timestamp}"`);
      });
      content = csvRows.join("\n");
      mimeType = "text/csv;charset=utf-8;";
      filename += ".csv";
    } else if (format === 'txt') {
      let txtRows = [];
      records.forEach(row => {
        txtRows.push(`${row.id}\t${row.timestamp}`);
      });
      content = txtRows.join("\n");
      mimeType = "text/plain;charset=utf-8;";
      filename += ".txt";
    }

    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", filename);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);

    closeModal();
  }

  // ── Camera Initialization ──────────────────────────────────

  async function startCamera() {
    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 15, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 };

    try {
      await html5QrCode.start({ facingMode: { exact: "environment" } }, config, onScanSuccess);
      statusDiv.innerText = "Ready to scan...";
    } catch (e1) {
      try {
        await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
        statusDiv.innerText = "Ready to scan...";
      } catch (e2) {
        statusDiv.innerText = "Camera permission denied";
        statusDiv.className = "status-box error";
      }
    }
  }

  startCamera();

  document.getElementById("hidden-file-input").addEventListener("change", (e) => {
    if (e.target.files.length === 0) return;
    html5QrCode.scanFile(e.target.files[0], true)
      .then(onScanSuccess)
      .catch(() => {
        statusDiv.innerText = "Failed to parse QR file";
        statusDiv.className = "status-box error";
      });
  });
</script>
</body>
</html>
