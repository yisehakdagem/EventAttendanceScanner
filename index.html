<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151c2c;
      --primary: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success-bg: #064e3b;
      --success-text: #34d399;
      --error-bg: #7f1d1d;
      --error-text: #f87171;
      --info-bg: #1e3a8a;
      --info-text: #60a5fa;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; margin: 0 0 4px 0; font-weight: 700; letter-spacing: -0.02em; }
    .header p { color: var(--text-muted); font-size: 0.875rem; margin: 0; }

    .scanner-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    #reader {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: none !important;
    }

    #reader video {
      border-radius: 14px;
      object-fit: cover;
      width: 100% !important;
    }

    #status-container {
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
    }

    .status-box {
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      transition: all 0.2s ease;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-box.error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .bottom-controls {
      margin-top: auto;
      padding-top: 24px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .btn-export {
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    .btn-export:active { transform: scale(0.98); }

    .file-upload-fallback { text-align: center; }
    .file-upload-fallback label {
      color: #475569;
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
    }
    .file-upload-fallback input { display: none; }

    #error-banner-container {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 420px;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .alert-banner {
      pointer-events: auto;
      padding: 12px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      font-size: 0.875rem;
      font-weight: 500;
      animation: slideUp 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .alert-banner.error {
      background: var(--error-bg);
      color: #fca5a5;
      border: 1px solid rgba(248, 113, 113, 0.4);
    }

    .alert-banner.success {
      background: var(--success-bg);
      color: #6ee7b7;
      border: 1px solid rgba(52, 211, 153, 0.4);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .alert-banner .close-btn {
      background: none;
      border: none;
      color: inherit;
      font-size: 1.25rem;
      font-weight: bold;
      cursor: pointer;
      padding: 0 0 0 12px;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>AYAC 2026 Attendance</h1>
    <p>Point camera at student QR code</p>
  </div>

  <div class="scanner-card">
    <div id="reader"></div>
  </div>

  <div id="status-container">
    <div id="status" class="status-box">Requesting Camera...</div>
  </div>

  <div class="bottom-controls">
    <button class="btn-export" onclick="exportScannedCSV()">Export Scanned IDs (CSV)</button>
    <div class="file-upload-fallback">
      <label for="hidden-file-input">Scan from image file instead</label>
      <input type="file" id="hidden-file-input" accept="image/*">
    </div>
  </div>

  <div id="error-banner-container"></div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRQYi29sudHW3Ijq327xzFD7YnUHplUlDXTlnsz4rJ2ovObQURDFXlRtKValOLG2c3/exec";
  const STORAGE_KEY = "ayac_scanned_records";

  const statusDiv = document.getElementById("status");
  let html5QrCode;

  // ── Local Persistence Helper Functions ─────────────────────

  function loadLocalRecords() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : [];
    } catch (e) {
      return [];
    }
  }

  function saveLocalRecord(id, timestamp) {
    const records = loadLocalRecords();
    records.push({ id: id, timestamp: timestamp });
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    } catch (e) {}
  }

  function isAlreadyScannedLocally(id) {
    const records = loadLocalRecords();
    return records.some(r => String(r.id).trim().toLowerCase() === String(id).trim().toLowerCase());
  }

  // ── Fire-and-Forget Network Request ────────────────────────

  function sendCheckInAsync(regId, action = "process") {
    const targetUrl = `${APPS_SCRIPT_URL}?id=${encodeURIComponent(regId)}&action=${action}&_=${Date.now()}`;
    
    if (navigator.sendBeacon) {
      navigator.sendBeacon(targetUrl);
    } else {
      fetch(targetUrl, { mode: 'no-cors' }).catch(() => {});
    }
  }

  // ── QR Scanner Logic ───────────────────────────────────────

  function onScanSuccess(decodedText) {
    let regId = decodedText.trim();
    if (regId.includes("id=")) {
      regId = regId.split("id=")[1].split("&")[0];
    }
    regId = regId.replace(/^["']|["']$/g, '').trim();

    if (!regId) return;

    if (isAlreadyScannedLocally(regId)) {
      showNotificationBanner(`ID ${regId} already scanned locally today.`, "error");
      return;
    }

    const timestamp = new Date().toISOString();

    // 1. Store locally immediately
    saveLocalRecord(regId, timestamp);

    // 2. Dispatch request asynchronously without waiting
    sendCheckInAsync(regId, "process");

    // 3. Update UI and continue scanning instantly
    showNotificationBanner(`Scanned ID: ${regId}`, "success");
    statusDiv.innerText = `Last scanned: ${regId}`;
    statusDiv.className = "status-box";
  }

  function showNotificationBanner(message, type = "error") {
    const container = document.getElementById("error-banner-container");
    const banner = document.createElement("div");
    banner.className = `alert-banner ${type}`;
    banner.innerHTML = `
      <span>${type === 'success' ? '✅' : '⚠️'} ${message}</span>
      <button class="close-btn" onclick="this.parentElement.remove()">✕</button>
    `;
    container.appendChild(banner);

    setTimeout(() => {
      if (banner.parentNode) banner.parentNode.removeChild(banner);
    }, 3000);
  }

  function exportScannedCSV() {
    const records = loadLocalRecords();
    if (!records || records.length === 0) {
      alert("No scanned records available to export yet.");
      return;
    }

    let csvRows = ["ID,Scan Timestamp"];
    records.forEach(row => {
      csvRows.push(`"${row.id}","${row.timestamp}"`);
    });

    const blob = new Blob([csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.setAttribute("href", url);
    link.setAttribute("download", `attendance_scans_${new Date().toISOString().slice(0,10)}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  async function startCamera() {
    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 15, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 };

    try {
      await html5QrCode.start({ facingMode: { exact: "environment" } }, config, onScanSuccess);
      statusDiv.innerText = "Ready to scan...";
    } catch (e1) {
      try {
        await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
        statusDiv.innerText = "Ready to scan...";
      } catch (e2) {
        statusDiv.innerText = "Camera permission denied";
        statusDiv.className = "status-box error";
      }
    }
  }

  startCamera();

  document.getElementById("hidden-file-input").addEventListener("change", (e) => {
    if (e.target.files.length === 0) return;
    html5QrCode.scanFile(e.target.files[0], true)
      .then(onScanSuccess)
      .catch(() => {
        statusDiv.innerText = "Failed to parse QR file";
        statusDiv.className = "status-box error";
      });
  });
</script>
</body>
</html>
