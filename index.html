<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success-bg: #064e3b;
      --success-text: #34d399;
      --error-bg: #7f1d1d;
      --error-text: #f87171;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; margin: 0 0 4px 0; font-weight: 700; letter-spacing: -0.02em; }
    .header p { color: var(--text-muted); font-size: 0.875rem; margin: 0; }

    .scanner-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #reader {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      border: none !important;
    }

    #reader video {
      border-radius: 12px;
      object-fit: cover;
    }

    #status-container {
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
    }

    .status-box {
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      transition: all 0.2s ease;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-box.success {
      background: var(--success-bg);
      color: var(--success-text);
      border: 1px solid rgba(52, 211, 153, 0.3);
    }

    .status-box.error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .status-box.processing {
      background: #1e1b4b;
      color: #818cf8;
      border: 1px solid rgba(129, 140, 248, 0.3);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Event Attendance</h1>
    <p>Point camera at student QR code</p>
  </div>

  <div class="scanner-card">
    <div id="reader"></div>
  </div>

  <div id="status-container">
    <div id="status" class="status-box">Initializing Camera...</div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRQYi29sudHW3Ijq327xzFD7YnUHplUlDXTlnsz4rJ2ovObQURDFXlRtKValOLG2c3/exec";
    const statusDiv = document.getElementById("status");

    async function onScanSuccess(decodedText) {
      html5QrcodeScanner.pause();
      
      statusDiv.className = "status-box processing";
      statusDiv.innerText = "Checking in...";

      let regId = decodedText;
      if (decodedText.includes("id=")) {
        regId = decodedText.split("id=")[1].split("&")[0];
      }

      const targetUrl = `${APPS_SCRIPT_URL}?id=${encodeURIComponent(regId)}`;

      try {
        // Mode 'cors' with follow redirect handles the Google Apps Script execution
        const response = await fetch(targetUrl, {
          method: "GET",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" }
        });

        const resultText = await response.text();

        statusDiv.innerText = resultText;
        if (resultText.includes("Attendance marked")) {
          statusDiv.className = "status-box success";
        } else {
          statusDiv.className = "status-box error";
        }
      } catch (err) {
        statusDiv.innerText = "Network Error: Re-check deployment access";
        statusDiv.className = "status-box error";
      }

      setTimeout(() => {
        statusDiv.className = "status-box";
        statusDiv.innerText = "Ready for next scan...";
        html5QrcodeScanner.resume();
      }, 2200);
    }

    const html5QrcodeScanner = new Html5QrcodeScanner("reader", {
      fps: 15,
      qrbox: { width: 220, height: 220 },
      aspectRatio: 1.0
    });

    html5QrcodeScanner.render(onScanSuccess, () => {
      statusDiv.innerText = "Ready to scan...";
    });
  </script>
</body>
</html>
