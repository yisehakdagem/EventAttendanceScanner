<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Attendance Scanner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #151c2c;
      --primary: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success-bg: #064e3b;
      --success-text: #34d399;
      --error-bg: #7f1d1d;
      --error-text: #f87171;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.5rem; margin: 0 0 4px 0; font-weight: 700; letter-spacing: -0.02em; }
    .header p { color: var(--text-muted); font-size: 0.875rem; margin: 0; }

    .scanner-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      position: relative;
    }

    #reader {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      border: none !important;
    }

    #reader video {
      border-radius: 14px;
      object-fit: cover;
      width: 100% !important;
    }

    #status-container {
      margin-top: 16px;
      width: 100%;
      max-width: 420px;
    }

    .status-box {
      padding: 14px 16px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 0.95rem;
      text-align: center;
      transition: all 0.2s ease;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .status-box.error {
      background: var(--error-bg);
      color: var(--error-text);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    .status-box.processing {
      background: #1e1b4b;
      color: #818cf8;
      border: 1px solid rgba(129, 140, 248, 0.3);
    }

    /* Success Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(9, 13, 22, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 24px;
      padding: 28px 24px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      transform: scale(0.9);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .icon-circle {
      width: 64px;
      height: 64px;
      background: var(--success-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
      border: 2px solid var(--success-text);
    }

    .icon-circle svg {
      width: 32px;
      height: 32px;
      fill: var(--success-text);
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 8px 0;
    }

    .modal-msg {
      font-size: 0.95rem;
      color: var(--success-text);
      font-weight: 600;
      margin: 0;
    }

    .file-upload-fallback {
      margin-top: auto;
      padding-top: 32px;
      text-align: center;
    }

    .file-upload-fallback label {
      color: #475569;
      font-size: 0.75rem;
      text-decoration: underline;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .file-upload-fallback input { display: none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Event Attendance</h1>
    <p>Point camera at student QR code</p>
  </div>

  <div class="scanner-card">
    <div id="reader"></div>
  </div>

  <div id="status-container">
    <div id="status" class="status-box">Requesting Camera...</div>
  </div>

  <!-- Success Modal -->
  <div id="successModal" class="modal-overlay">
    <div class="modal-card">
      <div class="icon-circle">
        <svg viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
      </div>
      <h3 class="modal-title">Success!</h3>
      <p id="modalMsg" class="modal-msg">Attendance Marked</p>
    </div>
  </div>

  <div class="file-upload-fallback">
    <label for="hidden-file-input">Scan from image file instead</label>
    <input type="file" id="hidden-file-input" accept="image/*">
  </div>

  <script>
    // Paste your exact Apps Script Deployment URL here
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzRQYi29sudHW3Ijq327xzFD7YnUHplUlDXTlnsz4rJ2ovObQURDFXlRtKValOLG2c3/exec";

    const statusDiv = document.getElementById("status");
    const successModal = document.getElementById("successModal");
    const modalMsg = document.getElementById("modalMsg");

    let html5QrCode;
    let isScanning = true;

    function showSuccessModal(message) {
      modalMsg.innerText = message;
      successModal.classList.add("active");
      
      setTimeout(() => {
        successModal.classList.remove("active");
      }, 2000);
    }

    // Sends cross-origin JSONP request to Apps Script
    function sendCheckInRequest(regId) {
      return new Promise((resolve, reject) => {
        const callbackName = "jsonp_callback_" + Math.round(100000 * Math.random());
        const script = document.createElement("script");

        window[callbackName] = function(data) {
          delete window[callbackName];
          document.body.removeChild(script);
          resolve(data.message);
        };

        script.onerror = function() {
          delete window[callbackName];
          document.body.removeChild(script);
          reject("Network Error: Request failed");
        };

        script.src = `${APPS_SCRIPT_URL}?id=${encodeURIComponent(regId)}&callback=${callbackName}`;
        document.body.appendChild(script);
      });
    }

    async function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;
      
      statusDiv.className = "status-box processing";
      statusDiv.innerText = "Checking in...";

      // Clean raw ID input
      let regId = decodedText.trim();
      if (regId.includes("id=")) {
        regId = regId.split("id=")[1].split("&")[0];
      }

      try {
        const resultText = await sendCheckInRequest(regId);

        if (resultText.includes("Attendance marked")) {
          statusDiv.className = "status-box";
          statusDiv.innerText = "Check-in successful!";
          showSuccessModal(resultText);
        } else {
          statusDiv.innerText = resultText;
          statusDiv.className = "status-box error";
        }
      } catch (err) {
        statusDiv.innerText = err;
        statusDiv.className = "status-box error";
      }

      setTimeout(() => {
        statusDiv.className = "status-box";
        statusDiv.innerText = "Ready for next scan...";
        isScanning = true;
      }, 2200);
    }

    // Force back-facing main camera directly
    function startCamera() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 15, qrbox: { width: 220, height: 220 }, aspectRatio: 1.0 };

      html5QrCode.start(
        { facingMode: { exact: "environment" } }, 
        config, 
        onScanSuccess
      ).catch(() => {
        // Fallback for devices without strict 'exact' string support
        html5QrCode.start(
          { facingMode: "environment" }, 
          config, 
          onScanSuccess
        ).then(() => {
          statusDiv.innerText = "Ready to scan...";
        }).catch(() => {
          statusDiv.innerText = "Camera permission denied or unavailable";
          statusDiv.className = "status-box error";
        });
      }).then(() => {
        statusDiv.innerText = "Ready to scan...";
      });
    }

    startCamera();

    document.getElementById("hidden-file-input").addEventListener("change", (e) => {
      if (e.target.files.length === 0) return;
      html5QrCode.scanFile(e.target.files[0], true)
        .then(onScanSuccess)
        .catch(() => {
          statusDiv.innerText = "Failed to parse QR from image file";
          statusDiv.className = "status-box error";
        });
    });
  </script>
</body>
</html>
